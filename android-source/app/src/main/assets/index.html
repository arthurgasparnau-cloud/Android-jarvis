<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#07111f"><title>J.A.R.V.I.S. Viewer</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#07111f;color:#e8f7ff;font:16px Arial,sans-serif;min-height:100vh}header{padding:28px 20px 18px;text-align:center;border-bottom:1px solid #123b52}h1{margin:0;color:#55dfff;letter-spacing:4px;font-size:25px}small{color:#7fa9bb;letter-spacing:2px}.panel{padding:22px;max-width:600px;margin:auto}.field{width:100%;padding:15px;margin:8px 0 14px;border:1px solid #1d5872;border-radius:10px;background:#0b1d2d;color:white;font-size:16px;outline:none}button{width:100%;padding:15px;border:0;border-radius:10px;background:#16b9df;color:#03101a;font-weight:bold;font-size:16px;margin:6px 0}.secondary{background:#12364b;color:#bcefff}#screen{width:100%;margin-top:18px;border:1px solid #1d5872;border-radius:10px;background:#02070d;min-height:180px;object-fit:contain}#status{text-align:center;color:#8eb7c8;font-size:13px;margin:12px}.hidden{display:none}.hint{color:#7399aa;font-size:12px;text-align:center;line-height:1.5}
</style></head><body><header><h1>J.A.R.V.I.S.</h1><small>REMOTE VIEWER</small></header><main class="panel"><div id="connect"><label>Endereço HTTPS do PC</label><input id="host" class="field" placeholder="https://arthur.tail25244c.ts.net" autocapitalize="none"><label>PIN de acesso</label><input id="pin" class="field" placeholder="PIN" inputmode="numeric"><button onclick="connect()">CONECTAR</button><p class="hint">O PC precisa estar ligado, com o JARVIS aberto e conectado ao Tailscale.</p></div><div id="view" class="hidden"><div id="status">Conectando...</div><img id="screen" alt="Tela do JARVIS"><button class="secondary" onclick="full()">TELA CHEIA</button><button class="secondary" onclick="disconnect()">DESCONECTAR</button></div></main>
<script>
const $=id=>document.getElementById(id);
function connect(){let h=$('host').value.trim().replace(/\/$/,''),p=$('pin').value.trim();if(!h.startsWith('https://')||!p){$('status').textContent='Informe o endereço HTTPS e o PIN.';return}$('connect').classList.add('hidden');$('view').classList.remove('hidden');$('status').textContent='Conectando ao JARVIS...';$('screen').src=h+'/stream?pin='+encodeURIComponent(p);$('screen').onload=()=>$('status').textContent='Conectado • Somente visualização';$('screen').onerror=()=>$('status').textContent='Falha na conexão. Verifique Tailscale, PIN e PC.'}
function disconnect(){$('screen').src='';$('view').classList.add('hidden');$('connect').classList.remove('hidden')}
function full(){let e=$('screen');if(e.requestFullscreen)e.requestFullscreen()}
</script></body></html>
