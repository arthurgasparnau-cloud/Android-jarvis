name: Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "android-source/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        working-directory: android-source
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Generate checksum
        working-directory: android-source
        run: |
          sha256sum app/build/outputs/apk/debug/app-debug.apk > app/build/outputs/apk/debug/SHA256SUMS.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Android-debug
          path: |
            android-source/app/build/outputs/apk/debug/app-debug.apk
            android-source/app/build/outputs/apk/debug/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
